wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  device.routes.default-source-volume = 1.0
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-R__DE_Microphones_R__DE_NT-USB_Mini_89C3EAB9-00.analog-stereo" }
      { node.name = "alsa_output.pci-0000_2f_00.1.hdmi-stereo" }
      { node.name = "alsa_input.usb-Schiit_Audio_I_m_Fulla_Schiit-00.analog-stereo" }
    ]

    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
